*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,'Malgun Gothic',sans-serif;background:#081c23;color:white}#app{position:relative;width:100vw;height:100dvh;overflow:hidden}#camera,#backdrop,#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#camera{display:none}#backdrop{background-position:center;background-size:cover;pointer-events:none}#scene{touch-action:none}#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0007,transparent 22%,transparent 76%,#0007)}header{position:absolute;top:max(10px,env(safe-area-inset-top));left:8px;right:8px;text-align:center;pointer-events:none;text-shadow:0 2px 7px #000}h1{font-size:clamp(20px,3.4vw,32px);margin:0}header p{font-size:clamp(12px,1.6vw,17px);margin:4px 0}#toolbar{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:0 10px}button{border:1px solid #ffffff8a;border-radius:28px;padding:11px 15px;background:#11404ce9;color:#fff;font-weight:700;font-size:clamp(13px,2vw,17px);cursor:pointer}button.active{background:#f2b84e;color:#182329}#message{position:absolute;bottom:90px;left:8px;right:8px;text-align:center;font-size:13px;text-shadow:0 2px 6px #000;pointer-events:none}#status{position:absolute;top:90px;left:12px;right:12px;text-align:center;color:#ffe2a5;font-size:12px;pointer-events:none}#loading{position:absolute;inset:0;background:#092934ef;display:grid;place-content:center;text-align:center;padding:25px}#loading[hidden]{display:none}#progress{font-size:14px} @media(max-width:600px){#message{bottom:112px}button{padding:10px 12px}}
</style></head><body><div id="app"><video id="camera" autoplay muted playsinline></video><div id="backdrop"></div><canvas id="scene"></canvas><div id="shade"></div><header><h1>🦁 내 책상 위의 사파리 동물원</h1><p id="subtitle">7마리 3D 동물을 만나보세요</p></header><div id="status"></div><div id="message"></div><div id="toolbar"></div><div id="loading"><div><h2>사파리 동물원 준비 중…</h2><p id="progress">동물의 원래 색상과 애니메이션을 불러옵니다.</p></div></div></div><audio id="forestAudio" src="sounds/forest.mp3" loop></audio><audio id="oceanAudio" src="sounds/ocean.mp3" loop></audio>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script>window.addEventListener('error',e=>{const p=document.getElementById('progress');if(p)p.textContent='초기화 오류: '+e.message;});window.addEventListener('unhandledrejection',e=>{const p=document.getElementById('progress');if(p)p.textContent='모델 처리 오류: '+(e.reason?.message||String(e.reason));});setTimeout(()=>{const el=document.getElementById('loading');if(el&&!el.hidden){document.getElementById('progress').textContent+=' · 로딩이 지연됩니다. 새로고침하거나 오류 문구를 확인해 주세요.'}},25000);</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
import {clone as cloneSkeleton} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/utils/SkeletonUtils.js';
const $=id=>document.getElementById(id), video=$('camera'), backdrop=$('backdrop'), toolbar=$('toolbar');
const renderer=new THREE.WebGLRenderer({canvas:$('scene'),alpha:true,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;renderer.toneMappingExposure=1;
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(46,1,.1,120);camera.position.set(0,0,12);camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0xffffff,2.8));const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(-3,8,10);scene.add(sun);
const loader=new GLTFLoader();loader.setCrossOrigin('anonymous');
// Sketchfab 구형 GLB의 KHR_materials_pbrSpecularGlossiness 확장을 지원하여 원본 diffuseTexture를 보존합니다.
// Three.js 기본 로더는 이 확장을 무시할 수 있어 동물이 회색으로 나타납니다.
loader.register(parser=>({name:'KHR_materials_pbrSpecularGlossiness',getMaterialType(i){return parser.json.materials?.[i]?.extensions?.KHR_materials_pbrSpecularGlossiness?THREE.MeshStandardMaterial:null},extendMaterialParams(i,p){const ext=parser.json.materials?.[i]?.extensions?.KHR_materials_pbrSpecularGlossiness;if(!ext)return Promise.resolve();p.metalness=0;p.roughness=.88;p.color=new THREE.Color().setRGB(...(ext.diffuseFactor||[1,1,1]).slice(0,3),THREE.LinearSRGBColorSpace);p.opacity=(ext.diffuseFactor||[1,1,1,1])[3];if(p.opacity<1)p.transparent=true;return ext.diffuseTexture?parser.assignTexture(p,'map',ext.diffuseTexture,THREE.SRGBColorSpace):Promise.resolve()}}));
const specs={bear:['bear','run'],rhino:['rhino','Animation'],sparrow:['sparrow','Sparrow_Fly'],whale:['sperm-whale','ArmatureAction'],turtle:['turtle','Swim Cycle'],rabbit:['rabbit',''],whiteRhino:['white-rhino','Action']};
const assets={},actors=[];let mode='home',stream=null,elapsed=0,drag=0,dragStart=null;const clock=new THREE.Clock();
function buttons(arr){toolbar.replaceChildren();for(const [label,cb,active] of arr){let b=document.createElement('button');b.textContent=label;b.className=active?'active':'';b.onclick=cb;toolbar.append(b)}}
function msg(s){$('message').textContent=s}function status(s){$('status').textContent=s}function background(file,opacity=1){backdrop.style.backgroundImage=`url('images/${file}')`;backdrop.style.opacity=opacity}
function sound(kind){for(const n of ['forest','ocean']){let a=$(n+'Audio');a.pause();a.volume=.3;if(kind===n){a.currentTime=0;a.play().catch(()=>{})}}}
function clear(){for(const a of actors){scene.remove(a.group);a.mixer?.stopAllAction()}actors.length=0}
// 애니메이션 시작 전 원본 메시의 경계상자를 측정하고, 크기와 중심을 독립적으로 정규화합니다.
function add(name,{x=0,y=0,z=-2,size=1,heading=0,behavior='idle',delay=0,phase=0}={}){
 const src=assets[name];if(!src)return;
 const model=cloneSkeleton(src.scene);model.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(model,true);if(box.isEmpty())return;
 const dim=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const max=Math.max(dim.x,dim.y,dim.z,1e-5);
 const pivot=new THREE.Group();const centering=new THREE.Group();centering.position.copy(center).multiplyScalar(-1);centering.add(model);pivot.add(centering);pivot.scale.setScalar(size/max);
 const group=new THREE.Group();group.add(pivot);group.position.set(x,y,z);pivot.rotation.y=heading;scene.add(group);
 let mixer=null;const clips=src.animations||[];if(clips.length){mixer=new THREE.AnimationMixer(model);const preferred=specs[name][1];const clip=clips.find(c=>preferred&&c.name.toLowerCase().includes(preferred.toLowerCase()))||clips[0];const safeTracks=clip.tracks.filter(track=>!/(^|\.)(position|scale)$/.test(track.name));if(safeTracks.length){const safeClip=new THREE.AnimationClip(clip.name+'-safe',clip.duration,safeTracks);mixer.clipAction(safeClip).play()}}
 const a={name,group,pivot,centering,model,mixer,behavior,delay,born:elapsed,origin:{x,y,z},phase,baseSize:size,baseCenter:center.clone(),maxDim:max,desiredSize:size,offset:new THREE.Vector3(),initialHeading:heading,initialPitch:0,initialPivotScale:size/max,userScale:1};actors.push(a);return a;
}
// 정면에서 측면이 보이도록 모델 방향을 결정: 모델의 장축이 X이면 Y축 회전 0,
// Z이면 90도 회전. 3D 원본마다 좌표계가 달라 최초 크기 계산 후 설정합니다.
function sideHeading(name){const s=assets[name];if(!s)return 0;const box=new THREE.Box3().setFromObject(s.scene);const d=box.getSize(new THREE.Vector3());return d.z>d.x?Math.PI/2:0}
// 화면 좌표 기준 배치: x,y는 0~1 (왼쪽→오른쪽, 위→아래). 화면 크기가 달라도 동일한 풍경 위치를 유지합니다.
function place(name,px,py,pixelHeight,options={}){
 const visibleH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*12;
 const worldH=visibleH*pixelHeight;
 const worldW=visibleH*camera.aspect;
 return add(name,{x:(px-.5)*worldW,y:(.5-py)*visibleH,z:0,size:worldH, ...options});
}
// 첫 화면은 3D 모델을 화면 속 특정 좌표에 배치합니다. 카메라 깊이는 일정하게 유지합니다.
// 원본 GLB의 스켈레톤 애니메이션이 일부 기종에서 거대한 발/몸통을 만드는 경우를 피하기 위해
// 첫 화면에서는 모델 자체의 애니메이션을 끄고 화면 내 이동 애니메이션을 적용합니다.
function home(){
 mode='home';clear();sound(null);video.style.display='none';background('safari-background.png',1);
 camera.position.set(0,0,12);camera.rotation.set(0,0,0);drag=0;status('');
 $('subtitle').textContent='7마리 3D 동물을 만나보세요';
 const b=place('bear',.275,.445,.125,{behavior:'homeBear',heading:sideHeading('bear')-.45});
 const r=place('rhino',.405,.585,.15*2,{behavior:'homeRhino',heading:sideHeading('rhino')+.35});
 const wr=place('whiteRhino',.58,.55,.13,{heading:sideHeading('whiteRhino')});
 const bird=place('sparrow',.53,.38,.085*2,{behavior:'homeBird',heading:sideHeading('sparrow')+Math.PI});
 const whale=place('whale',.84,.56,.24*1.5,{behavior:'homeWhale',heading:sideHeading('whale')});
 const turtle=place('turtle',.72,.865,.065*1.5*2.5,{behavior:'homeTurtle',heading:sideHeading('turtle')});
 const rabbit=place('rabbit',.29,.735,.16,{heading:sideHeading('rabbit')});
 // 배치된 모델의 정상적인 형태를 우선 확보합니다. 이동은 아래 animate()에서 처리합니다.
 for(const a of [wr,rabbit])if(a?.mixer){a.mixer.stopAllAction();a.mixer=null;}
 // 나머지 5종은 GLB 원본 애니메이션을 1배속으로 재생합니다.
 for(const a of [b,r,bird,whale,turtle])if(a?.mixer)a.mixer.timeScale=({bear:.5,whale:5,turtle:2.5}[a.name]??1);
 // 고래는 정면이 아닌 옆모습, 거북이는 등껍질과 머리가 함께 보이도록 기울입니다.
 if(whale){whale.initialHeading=sideHeading('whale');whale.mixer?.setTime(0);}
 if(turtle){turtle.initialHeading=sideHeading('turtle')+.3;turtle.initialPitch=-.18;}
 if(bird)bird.initialPitch=-.12;
 // 물가의 정지 코뿔소: 원본 색상은 보존하고 조명에 반응하는 밝기만 소폭 높입니다.
 if(wr)wr.model.traverse(o=>{if(o.isMesh){o.material=o.material.clone();if(o.material.color)o.material.color.multiplyScalar(1.3);o.material.needsUpdate=true;}});
 // 실제 표시된 경계상자를 매 프레임 검사하여 모델 원점이 멀리 떨어진 GLB도 화면 밖으로 튀지 않게 합니다.
 msg('동물을 터치하여 회전 · 두 손가락으로 확대/축소');buttons([['📷 카메라 켜기',startCamera,true]]);
}
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();video.style.display='block';mode='choose';clear();background('safari-background.png',.25);$('subtitle').textContent='체험관을 선택하세요';status('카메라 합성형 체험: 실제 바닥 인식이나 공간 고정 기능은 제공하지 않습니다.');msg('책상이나 바닥을 비추고 체험관을 선택하세요');buttons([['🌳 육지관',()=>enter('land')],['🌊 바다관',()=>enter('sea')],['처음으로',reset]])}catch(e){status('카메라 접근 실패: 브라우저 권한을 확인해 주세요.')}}
function reset(){stream?.getTracks().forEach(t=>t.stop());stream=null;home()}
function enter(which){mode=which;clear();drag=0;camera.rotation.set(0,0,0);camera.position.set(0,0,12);let land=which==='land';background(land?'forest-background.png':'ocean-background.png',.42);sound(land?'forest':'ocean');$('subtitle').textContent=land?'🌳 육지관 — 숲과 초원':'🌊 바다관 — 해저 탐험';msg(land?'동물을 선택해 주세요':'멀리서 동물이 다가옵니다');buttons(land?[['🐻 곰',()=>show('bear')],['🐦 새',()=>show('sparrow')],['🦏 코뿔소',()=>show('rhino')],['모두',()=>show('all')],['🌊 바다관',()=>enter('sea')]]:[['🐋 고래',()=>show('whale')],['🐢 거북이',()=>show('turtle')],['모두',()=>show('all')],['🌳 육지관',()=>enter('land')]])}
function show(name){clear();const multiple=name==='all';const spread=innerWidth<innerHeight?.75:1.5;if(mode==='land'){
 if(name==='bear'||multiple)place('bear',multiple?.28:.5,.60,multiple?.20:.29,{behavior:'run',heading:sideHeading('bear')-.4});
 if(name==='rhino'||multiple)place('rhino',multiple?.72:.5,.61,multiple?.20:.29,{behavior:'walk',heading:sideHeading('rhino')-.4,delay:multiple?.6:0});
 if(name==='sparrow'||multiple)place('sparrow',.5,multiple?.37:.49,multiple?.15:.23,{behavior:'fly',heading:sideHeading('sparrow'),delay:multiple?1:0});
 }else{
 if(name==='whale'||multiple)place('whale',multiple?.43:.5,.49,multiple?.21:.33,{heading:sideHeading('whale'),behavior:'approach',delay:0});
 if(name==='turtle'||multiple)place('turtle',multiple?.67:.5,.68,multiple?.14:.26,{heading:sideHeading('turtle'),behavior:'approach',delay:multiple?2:0});
 }msg(multiple?'동물들이 각자 움직이고 있습니다':'동물이 등장하고 있습니다')}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
// 동물별 독립 회전/확대: 한 손가락은 선택 동물 회전, 두 손가락은 선택 동물 확대/축소.
// 배경 드래그는 다른 동물에 영향을 주지 않습니다.
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
const touches=new Map();let selected=null,gesture=null;
function hitActor(e){
 const rect=renderer.domElement.getBoundingClientRect();
 pointer.set(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(actors.filter(a=>a.group.visible).map(a=>a.group),true);
 for(const hit of hits){let node=hit.object;while(node){const a=actors.find(a=>a.group===node);if(a)return a;node=node.parent}}
 return null;
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function initGesture(){
 if(!selected)return;
 const ps=[...touches.values()];
 if(ps.length>=2){gesture={type:'pinch',distance:Math.max(1,dist(ps[0],ps[1])),scale:selected.userScale||1};}
 else if(ps.length===1){gesture={type:'rotate',x:ps[0].x,y:ps[0].y};}
}
const canvas=$('scene');
canvas.addEventListener('pointerdown',e=>{
 e.preventDefault();
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(touches.size===1){selected=hitActor(e);gesture=null;}
 if(selected){initGesture();msg('동물 회전: 한 손가락 · 확대/축소: 두 손가락');}
 else msg('동물을 직접 터치하면 해당 동물만 회전·확대할 수 있습니다');
 canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
 if(!touches.has(e.pointerId))return;
 e.preventDefault();touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(!selected)return;
 const ps=[...touches.values()];
 if(ps.length>=2){
  if(!gesture||gesture.type!=='pinch')initGesture();
  const ratio=dist(ps[0],ps[1])/gesture.distance;
  selected.userScale=THREE.MathUtils.clamp(gesture.scale*ratio,.25,4);
 }else if(ps.length===1){
  if(!gesture||gesture.type!=='rotate')initGesture();
  const dx=ps[0].x-gesture.x,dy=ps[0].y-gesture.y;
  selected.userRotationY=(selected.userRotationY||0)+dx*.008;
  selected.userRotationX=THREE.MathUtils.clamp((selected.userRotationX||0)+dy*.004,-.9,.9);
  gesture.x=ps[0].x;gesture.y=ps[0].y;
 }
});
function endPointer(e){touches.delete(e.pointerId);if(!touches.size){selected=null;gesture=null}else initGesture()}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('lostpointercapture',endPointer);
canvas.addEventListener('wheel',e=>{e.preventDefault();const a=hitActor(e);if(a)a.userScale=THREE.MathUtils.clamp((a.userScale||1)*Math.exp(-e.deltaY*.001),.25,4)},{passive:false});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;for(const a of actors){if(a.mixer){a.mixer.update(dt);}
 const t=elapsed-a.born-a.delay;a.group.visible=t>=0;if(t<0)continue;const {x,y,z}=a.origin;
 switch(a.behavior){
 case 'homeBear':{const k=(1-Math.cos(t*Math.PI/24))/2;a.group.position.set(x+.12*k,y-.10*k,z);a.group.scale.setScalar(.62+.52*k);break}
 case 'homeRhino':{const k=(1-Math.cos(t*Math.PI/15))/2;a.group.position.set(x+.06*k,y-.08*k,z);a.group.scale.setScalar(.72+.34*k);break}
 case 'homeBird':{const k=(1-Math.cos(t*Math.PI/14))/2;a.group.position.set(x+Math.sin(t*.5)*.10,y+Math.sin(t*1.2)*.05,z);a.group.scale.setScalar(.65+.45*k);break}
 case 'homeWhale':a.group.position.y=y+Math.sin(t*.55*5)*.035;break;
 case 'homeTurtle':a.group.position.x=x+Math.sin(t*.45*2.5)*.15; a.group.position.y=y+Math.sin(t*.6*2.5)*.025;break;
 case 'run':case 'walk':{const speed=a.behavior==='run'?.08:.055;a.group.position.z=z+Math.min(t,7)*speed;a.group.position.y=y+Math.sin(t*3)*.035;if(t>9)a.born=elapsed;break}
 case 'fly':a.group.position.set(x+Math.sin(t*.8)*.22,y+Math.min(t,5)*.035,z);break;
 case 'approach':a.group.position.z=z+Math.min(t,13)*.06;a.group.position.y=y+Math.sin(t*.5)*.08;if(t>17)a.born=elapsed;break;
 }
 if(a.behavior==='idle')a.group.position.set(x,y,z);
 a.group.position.add(a.offset);
 a.pivot.rotation.y=a.initialHeading+(a.userRotationY||0);
 a.pivot.rotation.x=a.initialPitch+(a.userRotationX||0);
 a.pivot.scale.setScalar(a.initialPivotScale*(a.userScale||1));
 }
 // 모델 중심/크기는 최초 로딩 때만 계산합니다. 매 프레임 재계산하면
 // 뼈대 움직임에 따라 모델이 확대·축소되어 깜빡이는 현상이 발생합니다.
 camera.rotation.y=0;renderer.render(scene,camera)}
let loaded=0;await Promise.all(Object.entries(specs).map(async([name,[file]])=>{try{assets[name]=await loader.loadAsync('models/'+file+'.glb')}catch(e){console.error('GLB load failed',name,e);status(name+' 모델을 불러오지 못했습니다.')}finally{$('progress').textContent=`GLB ${++loaded} / 7 불러오는 중…`}}));$('loading').hidden=true;home();animate();
</script></body></html>
