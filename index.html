<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>내 책상 위의 사파리 동물원</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081c23;color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif;overflow:hidden}#app{position:relative;width:100vw;height:100dvh;overflow:hidden}#camera,#scene,#backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#camera{display:none;transform:scaleX(1)}#backdrop{background:center/cover no-repeat;opacity:1;pointer-events:none;transition:opacity .6s}#scene{z-index:2;display:block;touch-action:none}#shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(#0008,transparent 23%,transparent 75%,#0009)}header{position:absolute;z-index:4;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));text-align:center;pointer-events:none;text-shadow:0 2px 8px #000}h1{font-size:clamp(19px,4vw,31px);margin:0}header p{margin:4px 0;font-size:12px}#toolbar{position:absolute;z-index:5;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:7px;padding:0 10px}button{border:1px solid #ffffff6e;border-radius:25px;padding:11px 15px;background:#123b44e8;color:white;font-size:15px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}button:active{transform:scale(.97)}button.active{background:#edb34c;color:#18242a}#message{position:absolute;z-index:6;left:12px;right:12px;bottom:85px;text-align:center;font-size:13px;text-shadow:0 2px 5px #000;pointer-events:none}#loading{position:absolute;z-index:8;inset:0;display:grid;place-content:center;text-align:center;background:#0a2934e9;padding:30px}#loading[hidden]{display:none}#progress{margin-top:12px;font-size:14px}#status{position:absolute;z-index:7;top:75px;left:12px;right:12px;text-align:center;font-size:12px;color:#ffe5ad;pointer-events:none} @media(max-width:420px){button{padding:10px 12px;font-size:13px}}
</style></head><body><div id="app"><video id="camera" autoplay muted playsinline></video><div id="backdrop"></div><canvas id="scene"></canvas><div id="shade"></div><header><h1>🦁 내 책상 위의 사파리 동물원</h1><p id="subtitle">7마리 3D 동물을 만나보세요</p></header><div id="status"></div><div id="message">화면을 드래그하여 주변을 둘러보세요</div><div id="toolbar"></div><div id="loading"><h2>사파리 동물원 준비 중…</h2><div id="progress">3D 동물을 불러오고 있습니다.</div></div></div>
<audio id="forestAudio" src="sounds/forest.mp3" loop preload="none"></audio><audio id="oceanAudio" src="sounds/ocean.mp3" loop preload="none"></audio>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
import {clone as cloneSkeleton} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/utils/SkeletonUtils.js';
const $=id=>document.getElementById(id),canvas=$('scene'),backdrop=$('backdrop'),toolbar=$('toolbar'),video=$('camera');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,1,.05,100);camera.position.set(0,1.7,9);camera.lookAt(0,.9,0);scene.add(new THREE.HemisphereLight(0xe9f6ff,0x5c654a,2.4));const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(-4,9,7);scene.add(light);
const loader=new GLTFLoader();const defs={bear:{file:'bear',clip:'|run',size:2.1},rhino:{file:'rhino',clip:'Animation',size:2.3},sparrow:{file:'sparrow',clip:'Sparrow_Fly',size:.8},whale:{file:'sperm-whale',clip:'ArmatureAction',size:5},turtle:{file:'turtle',clip:'Swim Cycle',size:1.4},rabbit:{file:'rabbit',size:.65},whiteRhino:{file:'white-rhino',clip:'Action',size:1.9}};
const templates={},mixers=[],actors=[];let mode='home',stream=null,clock=new THREE.Clock(),elapsed=0,dragX=0,dragY=0,interaction=false;
function setButtons(items){toolbar.innerHTML='';for(const [label,fn,active] of items){const b=document.createElement('button');b.textContent=label;b.className=active?'active':'';b.onclick=fn;toolbar.append(b)}}
function note(t){$('message').textContent=t}function status(t){$('status').textContent=t}
function bg(file,opacity=1){backdrop.style.backgroundImage=`url('images/${file}')`;backdrop.style.opacity=opacity}
function audio(which){for(const n of ['forest','ocean']){const a=$(n+'Audio');a.pause();a.volume=.3;if(which===n){a.currentTime=0;a.play().catch(()=>status('소리를 들으려면 화면을 한 번 터치하세요.'))}}}
function clearActors(){for(const a of actors){scene.remove(a.root);if(a.mixer){a.mixer.stopAllAction();const i=mixers.indexOf(a.mixer);if(i>=0)mixers.splice(i,1)}}actors.length=0}
function add(name,x,y,z,scale=1,behavior='idle',delay=0){if(!templates[name])return;const source=templates[name];const object=cloneSkeleton(source.scene);const box=new THREE.Box3().setFromObject(object);const sz=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());object.position.sub(center);object.position.y+=sz.y/2;const group=new THREE.Group();group.add(object);group.scale.setScalar(defs[name].size/Math.max(sz.x,sz.y,sz.z)*scale);group.position.set(x,y,z);scene.add(group);
let mixer=null;const clips=source.animations||[];if(clips.length){mixer=new THREE.AnimationMixer(object);const key=defs[name].clip||'';const clip=clips.find(c=>c.name.includes(key))||clips[0];mixer.clipAction(clip).play();mixers.push(mixer)}const a={name,root:group,mixer,behavior,delay,born:elapsed,base:{x,y,z},scale:group.scale.x};actors.push(a);return a}
function home(){mode='home';clearActors();video.style.display='none';bg('safari-background.png',1);audio(null);camera.position.set(0,1.7,10);camera.lookAt(0,1,0);dragX=0;dragY=0;
add('bear',-3,-.65,0,.85);add('rhino',-.7,-.6,-1,.85);add('whiteRhino',2.9,-.65,-1,.8);add('rabbit',-1.8,-.85,2,1);add('sparrow',-.3,1.7,-2,1,'fly');add('whale',2.8,.2,-4,.65,'float');add('turtle',1.2,-.9,1,.7,'float');$('subtitle').textContent='7마리 3D 동물을 만나보세요';note('화면을 드래그하여 동물을 둘러보세요');setButtons([['📷 카메라 켜기',startCamera,true]])}
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();video.style.display='block';mode='choose';clearActors();bg('safari-background.png',.18);$('subtitle').textContent='체험관을 선택하세요';note('카메라로 책상이나 바닥을 비춰 보세요');status('이 버전은 카메라 합성형 체험입니다. 실제 평면 인식·공간 고정은 지원하지 않습니다.');setButtons([['🌳 육지관',()=>enter('land')],['🌊 바다관',()=>enter('sea')],['처음으로',reset]])}catch(e){status('카메라 접근 실패: HTTPS 연결과 브라우저 권한을 확인하세요.');note('카메라 권한을 허용한 뒤 다시 눌러 주세요.')}}
function reset(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}status('');home()}
function enter(where){mode=where;clearActors();dragX=0;dragY=0;camera.position.set(0,1.7,9);camera.lookAt(0,.9,0);const land=where==='land';bg(land?'forest-background.png':'ocean-background.png',.42);audio(land?'forest':'ocean');$('subtitle').textContent=land?'🌳 육지관 — 숲과 초원':'🌊 바다관 — 해저 탐험';note(land?'동물을 선택하면 바닥에서 등장합니다':'고래와 거북이가 먼바다에서 다가옵니다');const b=land?[['🐻 곰',()=>show('bear')],['🐦 새',()=>show('sparrow')],['🦏 코뿔소',()=>show('rhino')],['모두',()=>show('all')],['🌊 바다관',()=>enter('sea')]]:[['🐋 고래',()=>show('whale')],['🐢 거북이',()=>show('turtle')],['모두',()=>show('all')],['🌳 육지관',()=>enter('land')]];setButtons(b)}
function show(which){clearActors();if(mode==='land'){if(which==='bear'||which==='all')add('bear',-1.7,-3.2,-1,1,'run',0);if(which==='rhino'||which==='all')add('rhino',1.6,-3.2,-2,1,'walk',which==='all'?1.1:0);if(which==='sparrow'||which==='all')add('sparrow',0,-2.8,-1.5,1,'fly',which==='all'?.5:0)}else if(mode==='sea'){if(which==='whale'||which==='all')add('whale',-.8,.4,-19,.9,'approach',0);if(which==='turtle'||which==='all')add('turtle',1.4,-.5,-21,1,'approach',which==='all'?2:0)}note(which==='all'?'동물들이 각자 움직이고 있습니다':'동물이 등장하고 있습니다')}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let down=null;canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};interaction=true});canvas.addEventListener('pointermove',e=>{if(!down)return;dragX+=(e.clientX-down.x)*.003;dragY+=(e.clientY-down.y)*.0015;dragY=THREE.MathUtils.clamp(dragY,-.3,.3);down={x:e.clientX,y:e.clientY}});addEventListener('pointerup',()=>down=null);
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;for(const m of mixers)m.update(dt);for(const a of actors){let t=elapsed-a.born-a.delay;a.root.visible=t>=0;if(t<0)continue;const k=Math.min(t/1.35,1);if(a.behavior==='run'||a.behavior==='walk'){a.root.position.y=a.base.y+(a.base.y<0?Math.abs(a.base.y)*k:0);a.root.position.z=a.base.z+Math.min(t,7)*(a.behavior==='run'?.52:.24);if(t>8)a.root.position.z=a.base.z;}
else if(a.behavior==='fly'){a.root.position.y=a.base.y+Math.min(t,5)*.45;a.root.position.x=a.base.x+Math.sin(t*.7)*1.5;a.root.rotation.y=Math.sin(t*.6)*.3}
else if(a.behavior==='approach'){a.root.position.z=Math.min(a.base.z+Math.min(t,17)*(a.name==='whale'?.95:.72),3);a.root.position.y=a.base.y+Math.sin(t*.6)*.13;a.root.position.x=a.base.x+Math.sin(t*.25)*.35;if(t>20){a.born=elapsed;a.root.position.z=a.base.z}}
else if(a.behavior==='float'){a.root.position.y=a.base.y+Math.sin(t)*.08}}
if(interaction){camera.rotation.y=THREE.MathUtils.clamp(dragX,-.45,.45);camera.rotation.x=dragY}else{camera.rotation.y=0;camera.rotation.x=0}renderer.render(scene,camera)}

const names=Object.keys(defs);let done=0;await Promise.all(names.map(async n=>{try{templates[n]=await loader.loadAsync('models/'+defs[n].file+'.glb')}catch(e){console.error(n,e);status(n+' 모델 로딩 실패 — 파일명과 경로를 확인하세요.')}finally{$('progress').textContent=`GLB ${++done} / ${names.length} 불러오는 중…`}}));$('loading').hidden=true;home();animate();
</script></body></html>
